<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TravkinFlow Google Play feature graphic</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1024px; height: 500px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      place-items: center;
      color: #f3f4f6;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(224,177,0,.19), transparent 34%),
        radial-gradient(circle at 92% 88%, rgba(63,185,80,.10), transparent 32%),
        linear-gradient(135deg, #071019 0%, #101720 52%, #0b1622 100%);
    }
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      border: 1px solid rgba(224,177,0,.20);
      border-radius: 50%;
    }
    body::before { left: -390px; top: -275px; }
    body::after { right: -410px; bottom: -360px; }
    .frame {
      width: 880px;
      height: 372px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 56px;
      padding: 52px 64px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(17,27,38,.96), rgba(11,22,34,.88));
      box-shadow: 0 26px 80px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .logo-panel {
      display: grid;
      place-items: center;
      min-height: 170px;
      padding: 36px 28px;
      border-radius: 26px;
      background: #f7f4ec;
      box-shadow: inset 0 0 0 1px rgba(224,177,0,.24), 0 18px 50px rgba(0,0,0,.22);
    }
    .logo { width: 100%; height: auto; display: block; }
    .copy { border-left: 3px solid #e0b100; padding-left: 30px; }
    h1 { margin: 0 0 16px; font-size: 46px; line-height: 1.04; letter-spacing: -.025em; }
    p { margin: 0; color: #b9c4d0; font-size: 23px; line-height: 1.35; }
    .tag {
      display: inline-flex;
      margin-top: 24px;
      padding: 9px 14px;
      border: 1px solid rgba(224,177,0,.45);
      border-radius: 999px;
      color: #f2c94c;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="logo-panel">
      <img class="logo" src="../../../public/brand/v1/travkinflow-logo-154a0d68.png" alt="TravkinFlow" />
    </div>
    <section class="copy">
      <h1>Мобильный кабинет агронома</h1>
      <p>Защищённый доступ к рабочему профилю TravkinFlow.</p>
      <div class="tag">Android</div>
    </section>
  </main>
</body>
</html>
