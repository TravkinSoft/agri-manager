plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def buildConfigString = { value ->
    def escaped = String.valueOf(value ?: "").replace("\\", "\\\\").replace('"', '\\"')
    return '"' + escaped + '"'
}

def uploadKeystorePath = System.getenv("TRAVKINFLOW_UPLOAD_KEYSTORE")
def uploadStorePassword = System.getenv("TRAVKINFLOW_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = System.getenv("TRAVKINFLOW_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("TRAVKINFLOW_UPLOAD_KEY_PASSWORD")
def uploadSigningConfigured = uploadKeystorePath && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace "com.travkin.flow"
    compileSdk 36

    defaultConfig {
        applicationId "com.travkin.flow"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "APP_CHANNEL", '"production"'
        buildConfigField "String", "SUPABASE_URL", buildConfigString(System.getenv("TRAVKINFLOW_SUPABASE_URL"))
        buildConfigField "String", "SUPABASE_ANON_KEY", buildConfigString(System.getenv("TRAVKINFLOW_SUPABASE_ANON_KEY"))
    }

    signingConfigs {
        if (uploadSigningConfigured) {
            upload {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            resValue "string", "app_name", "TravkinFlow QA"
            buildConfigField "String", "BASE_URL", '"https://qa.travkinflow.com"'
            buildConfigField "String", "APP_CHANNEL", '"qa"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            resValue "string", "app_name", "TravkinFlow"
            buildConfigField "String", "BASE_URL", '"https://travkinflow.com"'
            if (uploadSigningConfigured) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"

    // Compose 1.12 requires compileSdk 37 / AGP 9.1. Keep the latest
    // official Compose line compatible with the current API 36 Play target.
    def composeBom = platform("androidx.compose:compose-bom:2026.06.00")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation platform("com.squareup.okhttp3:okhttp-bom:5.3.0")
    implementation "com.squareup.okhttp3:okhttp"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    testImplementation "junit:junit:4.13.2"
}

// User expanded the product from a minimal identity screen to the full cabinet.
// Fail before packaging/signing, including direct Gradle invocations.
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            def readinessFile = rootProject.file("../docs/google-play/agronomist-release-readiness.json")
            if (!readinessFile.exists()) throw new GradleException("Full Agronomist acceptance manifest missing")
            def readiness = new groovy.json.JsonSlurper().parse(readinessFile)
            if (readiness.readyForInternalTest != true || readiness.deviceAcceptance != true || readiness.roleRealisticQa != true) {
                throw new GradleException("Full Agronomist cabinet is not accepted. Release is blocked; use debug verification only.")
            }
        }
    }
}
